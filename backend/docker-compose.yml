services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["uploads:/app/storage"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -Q sentinelx
    env_file: .env
    volumes: ["uploads:/app/storage"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sentinelx"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/sentinelx-password
      NEO4J_PLUGINS: '[]'
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:7474"], interval: 10s, timeout: 5s, retries: 12 }

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  uploads:
