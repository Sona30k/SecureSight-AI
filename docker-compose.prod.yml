x-app-environment: &app-environment
  ENVIRONMENT: production
  DEBUG: "false"
  ENABLE_API_DOCS: "false"
  DEMO_MODE: "false"
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shieldiq}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shieldiq}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
  CORS_ORIGINS: '["https://${APP_DOMAIN:?Set APP_DOMAIN}"]'
  ALLOWED_HOSTS: '["${APP_DOMAIN}","localhost","127.0.0.1"]'
  STORAGE_PATH: /app/storage
  FORWARDED_ALLOW_IPS: "*"

x-api-service: &api-service
  build:
    context: ./backend
    dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
  env_file:
    - .env.production
  environment:
    <<: *app-environment
  volumes:
    - uploads:/app/storage
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    - backend
    - egress

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  api:
    <<: *api-service
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    <<: *api-service
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -Q shieldiq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *api-service
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shieldiq}
      POSTGRES_USER: ${POSTGRES_USER:-shieldiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shieldiq} -d ${POSTGRES_DB:-shieldiq}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: sh -c 'redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend:
  egress:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  uploads:
